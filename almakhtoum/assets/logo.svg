<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" role="img" aria-labelledby="t">
  <title id="t">Almakhtoum</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9CF8A"/>
      <stop offset=".5" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#8E6A24"/>
    </linearGradient>
  </defs>
  <!-- The seal: "Almakhtoum" (المختوم) means "the sealed" -->
  <g transform="translate(50 50)">
    <circle r="42" fill="url(#g)"/>
    <circle r="44" fill="none" stroke="url(#g)" stroke-width="6" stroke-dasharray="4.6 2.3"/>
    <circle r="34" fill="none" stroke="#141019" stroke-opacity=".35" stroke-width="1.2"/>
    <!-- Monogram A whose apex is a hanger hook -->
    <g fill="none" stroke="#141019" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-17 20 L0 -16 L17 20" stroke-width="6"/>
      <path d="M-10 7 H10" stroke-width="4"/>
      <path d="M0 -16 V-20 q0 -7 6 -7 q6 0 6 6 q0 4 -5 5" stroke-width="3"/>
    </g>
  </g>
  <text x="110" y="58" font-family="'Cormorant Garamond', Georgia, serif" font-size="40" font-weight="600" letter-spacing="6" fill="#141019">ALMAKHTOUM</text>
  <text x="112" y="82" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="5.2" fill="#8E6A24">CLOTHES · BAGS · SHOES</text>
</svg>
